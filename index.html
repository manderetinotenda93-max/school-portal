<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#14213d">
<title>School Portal</title>

<style>
:root {
  --ink: #14213d;
  --paper: #f5f8fc;
  --accent: #1f8a9e;
  --muted: #5b6784;
  --warn: #c2410c;
  --border: #dde4ef;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  min-height: 100%;
}

body {
  font-family: "Trebuchet MS", Verdana, sans-serif;
  background: var(--paper);
  color: var(--ink);
}

button,
input,
select {
  font-family: inherit;
}

.screen {
  display: none;
  min-height: 100vh;
  min-height: 100dvh;
}

.screen.active {
  display: flex;
}

/* JOIN SCREEN */

#join {
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: var(--ink);
}

.box {
  background: #fff;
  padding: 28px;
  border-radius: 20px;
  width: 100%;
  max-width: 400px;
  display: grid;
  gap: 12px;
  box-shadow: 0 12px 35px rgba(0, 0, 0, 0.2);
}

.box h1 {
  font-size: 1.6rem;
}

.box p {
  color: var(--muted);
  font-size: 0.9rem;
  line-height: 1.4;
}

input,
select {
  padding: 12px;
  font: inherit;
  border: 2px solid #cfd8e6;
  border-radius: 10px;
  width: 100%;
  background: #fff;
  color: var(--ink);
}

input:focus,
select:focus {
  outline: none;
  border-color: var(--accent);
}

button {
  padding: 12px 18px;
  font: inherit;
  font-weight: bold;
  background: var(--accent);
  color: #fff;
  border: 0;
  border-radius: 10px;
  cursor: pointer;
}

button:active {
  transform: scale(0.98);
}

#err {
  color: var(--warn);
  font-size: 0.85rem;
  min-height: 1em;
}

/* APP */

#app {
  flex-direction: column;
  background: var(--paper);
}

/* TOP BAR */

.top {
  background: var(--ink);
  color: #fff;
  padding: 12px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

.top strong {
  display: block;
  word-break: break-word;
}

.top small {
  color: #cfe3ea;
  display: block;
  margin-top: 3px;
}

.dot {
  display: inline-block;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #e0a82e;
  margin-right: 6px;
}

.dot.on {
  background: #3ecf8e;
}

.top button {
  background: transparent;
  border: 1px solid #cfe3ea;
  padding: 6px 12px;
}

/* TABS */

#tabs {
  display: flex;
  overflow-x: auto;
  background: #fff;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

#tabs button {
  background: none;
  color: var(--muted);
  border-radius: 0;
  padding: 12px 16px;
  white-space: nowrap;
  border-bottom: 3px solid transparent;
}

#tabs button.active {
  color: var(--ink);
  border-bottom-color: var(--accent);
}

.badge {
  background: var(--warn);
  color: #fff;
  border-radius: 999px;
  font-size: 0.7rem;
  padding: 1px 7px;
  margin-left: 6px;
}

/* MESSAGES */

#messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-height: 0;
}

.msg {
  max-width: 82%;
  padding: 8px 12px;
  border-radius: 16px;
  background: #fff;
  box-shadow: 0 1px 2px rgba(20, 33, 61, 0.15);
  word-wrap: break-word;
  overflow-wrap: anywhere;
}

.msg.mine {
  align-self: flex-end;
  background: var(--accent);
  color: #fff;
}

.msg.notice {
  align-self: stretch;
  max-width: 100%;
  border-left: 5px solid var(--warn);
  border-radius: 8px;
}

.who {
  font-size: 0.74rem;
  font-weight: bold;
  color: var(--accent);
}

.msg.mine .who {
  color: #d9f1f5;
}

.role {
  font-weight: normal;
  color: var(--muted);
}

.msg.mine .role {
  color: #d9f1f5;
}

.time {
  font-size: 0.68rem;
  opacity: 0.65;
  text-align: right;
  margin-top: 4px;
}

.sys {
  align-self: center;
  font-size: 0.78rem;
  color: var(--muted);
  text-align: center;
  padding: 8px;
}

/* SEND BAR */

#sendForm {
  display: flex;
  gap: 8px;
  padding: 10px;
  background: #fff;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}

#sendForm input {
  flex: 1;
  min-width: 0;
}

#sendForm button {
  flex-shrink: 0;
}

/* SMALL PHONES */

@media (max-width: 420px) {

    padding: 22px;
  }

  #messages {
    padding: 12px;
  }

  .msg {
    max-width: 90%;
